version: '3.8'

services:
  fixpilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixpilot-agent
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.studio.nebius.com/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - MODEL_CLASSIFY=nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - MODEL_ANALYZE=nvidia/nemotron-3-ultra-550b-a55b
      - MODEL_FIX=nvidia/nemotron-3-super-120b-a12b
      - MODEL_VALIDATE=nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - MAX_RETRIES=3
      - SANDBOX_TIMEOUT=30
    restart: unless-stopped
