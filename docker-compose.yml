version: '3.8'

services:
  fixpilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixpilot-agent
    ports:
      - "8000:8000"
    environment:
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.studio.nebius.com/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - MODEL_CLASSIFY=nvidia/nemotron-3-nano
      - MODEL_ANALYZE=nvidia/nemotron-3-ultra
      - MODEL_FIX=nvidia/nemotron-3-super
      - MODEL_VALIDATE=nvidia/nemotron-3-nano
      - MAX_RETRIES=3
      - SANDBOX_TIMEOUT=30
    restart: unless-stopped
